<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #212121;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .loader{
        height: 25px;
        width: 25px;
        border: 2px solid red;
        box-shadow: 0px 0px 5px red;
        animation: loading 3s infinite linear alternate;
    }

    @keyframes loading {
        0%{
            transform: translateY(100px) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
        }   
        25%{
            transform: translateY(-100px) rotateX(180deg) rotateY(0deg) rotateZ(0deg);
        }
        50%{
            transform: translateX(0px) rotateX(0deg) rotateY(180deg) rotateZ(0deg);
        }
        75%{
            transform: translateX(100px) rotateX(0deg) rotateY(0deg) rotateZ(180deg);
        }
        100%{
            transform: translateX(-100px) rotateX(180deg) rotateY(180deg) rotateZ(180deg);
        }
    }

</style>
<body>
    <div class="loader"></div>
</body>
</html>
