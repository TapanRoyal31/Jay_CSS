<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #212121;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box{
        height: 300px;
        aspect-ratio: 1 / 1;
        border: 2px solid blue;
        background-image: url(image.png);
        background-size: cover;
        background-repeat: no-repeat;
        /* background-position: 10px 20px; */
        background-clip: content-box;
        padding: 10px;
        background-image: linear-gradient(45deg, red 20%,yellow 40% 60%, aqua 80%);
        background: repeating-linear-gradient(45deg, red 0% 5%, orangered 5% 10%, orange 10% 15%);
        background: radial-gradient(circle at top left, aqua 50px,rgb(13, 22, 119) 150px);
    }
</style>
<body>
    <div class="box">

    </div>
</body>
</html>
