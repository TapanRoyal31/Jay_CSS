<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <script
    src="https://kit.fontawesome.com/ecedaf7aac.js"
    crossorigin="anonymous"
  ></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .image,.title{
        display: flex;
        justify-content: center;
        margin-top: 40px;
    }
    /* .title{
    } */
    .card {
      height: 400px;
      width: 300px;
      border: 3px solid black;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 30px;
    }
    .title,.text{
        color: black;
    }
    .text{
        font-weight: 400;
        text-align: center;
        line-height: 25px;
    }
    button{
        background-color: black;
        color: white;
        padding: 10px 50px;
        border-radius: 20px;
    }
  </style>
  <body>
    <div class="card">
      <div class="image">
        <i class="fa-brands fa-twitter fa-2xl" style="color: rgb(0, 0, 0) ; font-size: 100px;"></i>
      </div>
      <div class="title">
        <h1>TWITTER</h1>
      </div>
      <div class="text">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. A officia inventore sunt cumque iste sapiente perspiciatis fugit quae harum? Exercitationem.
      </div>
      <button>READ MORE</button>
    </div>
  </body>
</html>
